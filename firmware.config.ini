[meta]
profile = full
board = megaatmega2560

[modules]
logging = on
sd_logging = on
secondary_serial = on
comms_extended = on
can = on
table_switching = on
engine_protection = on
launch_flatshift = on
launch_control = on
fan_aircon = on
programmable_io = on
nitrous = on
knock = on
advanced_engine = on
etb = off

[advanced_engine]
boost = on
vvt = on
wmi = on
launch_flatshift = on

[services]
aux_pwm = advanced_engine.vvt

[dependencies]
boost = advanced_engine, aux_pwm
vvt = advanced_engine
wmi = advanced_engine, aux_pwm
launch_flatshift = advanced_engine
