[meta]
profile = full
board = megaatmega2560

[modules]
logging = on
secondary_serial = on
comms_extended = on
table_switching = on
advanced_engine = on

[advanced_engine]
boost = on
vvt = on
wmi = on
nitrous = on
launch_flatshift = on
fan_aircon = on

[services]
aux_pwm = advanced_engine.vvt

[dependencies]
boost = advanced_engine, aux_pwm
vvt = advanced_engine
wmi = advanced_engine, aux_pwm
nitrous = advanced_engine
launch_flatshift = advanced_engine
fan_aircon = advanced_engine
